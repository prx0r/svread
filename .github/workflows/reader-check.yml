name: Reader integrity
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python3 scripts/release_manifest.py
      - run: node --check app.js && node --check sw.js && node --check scholar-workspace-ui.js && node --check scholar-voice.js
      - run: node --test tests/*.cjs
      - run: python3 -m unittest discover -s mcp -p "test_*.py" -v
