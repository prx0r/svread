<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#253b46}.title{font:normal 42px Georgia,serif;fill:#182e39}.kicker{font-size:12px;letter-spacing:2px;fill:#927039;font-weight:bold}.name{font-size:19px;font-weight:bold}.desc{font-size:13px;fill:#667981}.tag{font-size:11px;letter-spacing:1.5px;fill:#8e7a51}.small{font-size:12px;fill:#617078}.step{fill:#fffefa;stroke:#d5ccbc;stroke-width:1.4}.arrow{stroke:#a98a51;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><rect x="0" y="0" width="1200" height="760" rx="0" fill="#f8f6f0" stroke="#f8f6f0" stroke-width="1.4"/><text x="70" y="70" class="kicker" text-anchor="start">PROGRESSIVE LEARNING MODULES</text><text x="70" y="125" class="title" text-anchor="start">Connected wheels, not one overloaded disc</text><rect x="64" y="208" width="344" height="202" rx="14" fill="#fffefa" stroke="#d5ccbc" stroke-width="1.4"/><rect x="82" y="226" width="42" height="42" rx="21" fill="#d9e7e9" stroke="#d9e7e9" stroke-width="1.4"/><text x="103" y="254" text-anchor="middle" style="font:bold 18px Arial;fill:#265c70">I</text><text x="140" y="252" class="tag" text-anchor="start">WORD FAMILIES</text><text x="86" y="321" style="font:500 25px Noto Sans Devanagari,Nirmala UI,serif;fill:#263e4a">कुत्र  ·  कदा  ·  कुतः  ·  कथम्</text><text x="86" y="367" class="desc" text-anchor="start">Stem + function</text><path d="M 411 309 l 29 0 m -7 -7 l 7 7 -7 7" class="arrow"/><rect x="447" y="208" width="344" height="202" rx="14" fill="#fffefa" stroke="#d5ccbc" stroke-width="1.4"/><rect x="465" y="226" width="42" height="42" rx="21" fill="#d9e7e9" stroke="#d9e7e9" stroke-width="1.4"/><text x="486" y="254" text-anchor="middle" style="font:bold 18px Arial;fill:#265c70">II</text><text x="523" y="252" class="tag" text-anchor="start">PERSON &amp; POSSESSION</text><text x="469" y="321" style="font