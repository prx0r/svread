<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#253b46}.title{font:normal 42px Georgia,serif;fill:#182e39}.kicker{font-size:12px;letter-spacing:2px;fill:#927039;font-weight:bold}.name{font-size:19px;font-weight:bold}.desc{font-size:13px;fill:#667981}.tag{font-size:11px;letter-spacing:1.5px;fill:#8e7a51}.small{font-size:12px;fill:#617078}.step{fill:#fffefa;stroke:#d5ccbc;stroke-width:1.4}.arrow{stroke:#a98a51;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><rect x="0" y="0" width="1200" height="740" rx="0" fill="#f8f6f0" stroke="#f8f6f0" stroke-width="1.4"/><text x="70" y="70" class="kicker" text-anchor="start">GRAMMAR ENGINE · DESIGN 01</text><text x="70" y="124" class="title" text-anchor="start">From turning a ring to speaking Sanskrit</text><rect x="70" y="215" width="240" height="140" rx="13" fill="#eaf1f1" stroke="#d5ccbc" stroke-width="1.4"/><text x="88" y="243" class="tag" text-anchor="start">1 · INTENTION</text><text x="88" y="285" class="name" text-anchor="start">Choose meaning</text><text x="88" y="318" class="desc" text-anchor="start">subject · time · place · action</text><path d="M 312 284 L 359 284 m -9 -6 l 9 6 -9 6" class="arrow"/><rect x="366" y="215" width="240" height="140" rx="13" fill="#fffefa" stroke="#d5ccbc" stroke-width="1.4"/><text x="384" y="243" class="tag" text-anchor="start">2 · VALIDATE</text><text x="384" y="285" class="name" text-anchor="start">Check constraints</text><text x="384" y="318" class="desc" text-anchor="start">person · gender · verb roles</text><path d="M 608 284 L 655 284 m -9 -6 l 9 6 -9 6" class="arrow"/><rect x="662" y="215" width="240" height="140" rx="13" fill="#eaf1f1" stroke="#d5ccbc" stroke-width="1.4"/><text x="680" y="243" class="tag" text-anchor="start">3 · INFLECT</text><text x="680" y="285" class="name" text-anchor="start">Find verified forms</text><text x="680" y="318" class="desc" text-anchor="start">curated set → Vidyut later</text><path d="M 904 284 L 951 284 m -9 -6 l 9 6 -9 6" class="arrow"/><rect x="958" y="215" width="240" height="140" rx="13" fill="#fffefa" stroke="#d5ccbc" stroke-width="1.4"/><text x="976" y="243" class="tag" text-anchor="start">4 · CONSTRUCT</text><text x="976" y="285" class="name" text-anchor="start">Build sentence</text><text x="976" y="318" class="desc" text-anchor="start">word order · optional sandhi</text><rect x="235" y="451" width="730" height="165" rx="16" fill="#1d3744" stroke="#1d3744" stroke-width="1.4"/><text x="600" y="487" text-anchor="middle" style="font:700 12px Arial;letter-spacing:3px;fill:#dfbc77">OUTPUT · DEVANAGARI IN LEARNING VIEW</text><text x="600" y="548" text-anchor="middle" style="font:600 37px Noto Sans Devanagari,Nirmala UI,serif;fill:#fffdf6">मम माता सर्वदा तत्र सुखिनी अस्ति।</text><text x="600" y="588" text-anchor="middle" style="font:18px Georgia,serif;fill:#d8e5e7">My mother is always happy there.</text><path d="M 1080 355 L 1080 406 L 600 406 L 600 448 m -8 -8 l 8 8 8 -8" class="arrow"/><text x="600" y="665" class="small" text-anchor="middle">The wheel is a control surface. The grammatical result comes from the engine.</text></svg>